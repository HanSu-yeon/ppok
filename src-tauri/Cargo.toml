[package]
name = "ppok"
version = "0.1.0"
description = "뽁 — 일하는 동안 뽁! 하고 나타나는 단어 카드"
authors = ["ppok"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "ppok_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
rusqlite = { version = "0.42", features = ["bundled"] }
calamine = "0.38"
csv = "1.3"
encoding_rs = "0.8"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
thiserror = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
